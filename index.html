function ag(h){var l=h[h.length-1];if(!l)return"";var m=Math.floor((Date.now()-l.t)/6e4),s=stale(),c=m<=s?"var(--mu)":m<=3*s?"var(--ac)":"var(--dn)";var tx=m<1?"à l'instant":m<60?"il y a "+m+" min":m<1440?"il y a "+Math.floor(m/60)+" h":"il y a "+Math.floor(m/1440)+" j";return'<div class="age" style="color:'+c+'" title="Dernier relevé : '+new Date(l.t).toLocaleString("fr-FR")+'">'+tx+"</div>"}
function am(it,p){var z=sg(it);return z<0?'<span class="al dn" title="Prix bas : bon moment pour acheter">▼ achat</span>':z>0?'<span class="al up" title="Prix haut : bon moment pour vendre">▲ vente</span>':""}
function beep(){if(!db.snd)return;try{var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.025;o.start();setTimeout(function(){o.stop();c.close()},250)}catch(e){}}
function showToast(m,k){var t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");t.onclick=function(){t.style.display="none"};document.body.appendChild(t)}t.className=k||"";t.textContent=m;t.style.display="block";clearTimeout(showToast.h);showToast.h=setTimeout(function(){t.style.display="none"},12000)}
function notify(){var cur={},fresh=[],zs=[],n=0;db.items.forEach(function(i){var z=sg(i);cur[i.id]=z;if(z)n++;if(prevSig&&z&&prevSig[i.id]!==z){fresh.push((z<0?"▼ Achat : ":"▲ Vente : ")+i.name);zs.push(z)}});
  document.title=(n?"("+n+") ":"")+"HDV Nano";prevSig=cur;
  if(fresh.length){var m=fresh.join(" · ");showToast(m,zs.every(function(z){return z>0})?"up":zs.every(function(z){return z<0})?"dn":"");beep();try{if(db.snd&&window.Notification&&Notification.permission=="granted")new Notification("HDV Nano",{body:m})}catch(e){}}}

function clean(){var now=Date.now(),n=0;db.items.forEach(function(it){var b0=it.h.length,m={},keep=[];
  it.h.slice().sort(function(a,b){return a.t-b.t}).forEach(function(x){var a=now-x.t;if(a<=7*DAY){keep.push(x);return}var u=a>30*DAY?DAY:36e5,k=Math.floor(x.t/u),o=m[k];if(!o){m[k]=x;keep.push(x)}else if(x.p<o.p){keep[keep.indexOf(o)]=x;m[k]=x}});
  it.h=keep;n+=b0-keep.length});return n}

  var form=adding?'<div class="panel form" style="margin-bottom:12px"><label>Nom<input id="nn" placeholder="Nom de l\'objet"></label><label>Catégorie<select id="nc">'+catOpts(filter)+'</select></label><label>Rareté<select id="nr">'+rarOpts(0)+'</select></label><label>Prix<input id="np" type="number" min="0"></label><div style="align-self:end;display:flex;gap:8px"><button class="pri" data-a="create">Ajouter</button><button data-a="cancel">Annuler</button></div></div>':"";
  return'<header><div><h1 class="brand">HDV Nano</h1><p>'+(ED?"":"Prix partagés par la guilde (lecture seule).")+'</p>'+upd()+'</div><div class="bar">'+(ED?'<button class="pri" data-a="pub">'+(db.rev>pubRev?(window.claude?"Publier pour la guilde":"Télécharger la mise à jour"):"Publié ✓")+"</button>":"")+(SA&&!ED?'<button data-a="adm">🔒 Admin</button>':"")+(SA&&ED?'<button data-a="out">Quitter le mode admin</button>':"")+'<button data-a="snd" class="'+(db.snd?"on":"")+'">Son : '+(db.snd?"activé":"désactivé")+'</button><button data-a="io">Sauvegarde</button><button data-a="theme">Thème</button><button data-a="reset" class="del">'+(conf=="reset"?"Confirmer":"Réinitialiser")+'</button></div></header>'+admPanel()+
  '<div class="bar">'+nav()+'</div>'+deals()+'<div class="bar">'+tabs()+"</div>"+
  iop()+'<div class="bar"><input id="q" type="search" placeholder="Rechercher…" value="'+esc(q)+'" style="min-width:220px"><button class="pri" data-a="add">+ Nouvel objet</button><button data-a="qu" class="'+(qu?"on":"")+'">Mise à jour rapide</button>'+(qu?'<button data-a="chk" title="Marque tous les prix comme vérifiés à l\'instant">Tout est à jour</button>':"")+'<label class="cat">Relevé périmé après <input id="sa" type="number" min="1" value="'+stale()+'" style="width:70px"> min</label><label class="cat">Signal auto : ±<input id="sp" type="number" min="1" value="'+sigp()+'" style="width:60px">% de la médiane 7j</label></div>'+form+

function detail(it){
  var s=stats(it),now=new Date(),iso=new Date(now-now.getTimezoneOffset()*6e4).toISOString().slice(0,16);
  var hist=s.h.slice().reverse().slice(0,30).map(function(x){var i=it.h.indexOf(x);

  var rg=["3h","6h","12h","24h","7d","14d","30d","Tout"].map(function(r){return'<button data-a="range" data-v="'+r+'" class="'+(range==r?"on":"")+'">'+r+"</button>"}).join("");
  return'<button class="back" data-a="back">← Retour au marché</button>'+

  '<div class="panel stats"><div><span>Prix le plus bas</span><b>'+fmt(s.p)+"</b>"+am(it,s.p)+ag(s.h)+"</div><div><span>3h</span><b>"+pct(s.d3)+"</b>"+pa(s.a3)+"</div><div><span>6h</span><b>"+pct(s.d6)+"</b>"+pa(s.a6)+"</div><div><span>12h</span><b>"+pct(s.d12)+"</b>"+pa(s.a12)+"</div><div><span>24h</span><b>"+pct(s.d24)+"</b>"+pa(s.a24)+"</div><div><span>7j</span><b>"+pct(s.d7)+"</b>"+pa(s.a7)+"</div><div><span>Médiane 7j</span><b>"+fmt(Math.round(s.med))+'</b></div><div style="border:0"><span>Fourchette 7j</span><b>'+fmt(s.min)+" – "+fmt(s.max)+"</b></div></div>"+
  '<div class="grid"><div class="panel"><div class="ph"><h2>Historique des prix</h2><div class="bar" style="margin:0">'+rg+"</div></div><div style=\"padding:10px\">"+chart(s.h,it)+"</div></div>"+
